name: Claude-mem catalog candidate proof

on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claude-mem-native-catalog-proof
  cancel-in-progress: false
jobs:
  linux:
    name: Linux canonical core (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: 'catalog-case'
            head: '9d8bf2a29cbb6e990ecddd302fc595377eb6b4a0'
            source: 'src/services/sqlite/SessionStore.ts'
            regression: 'tests/worker/http/routes/data-session-catalog-case.test.ts'
            positive: 2
            before_pass: 0
            before_fail: 2
            source_hash: 'ad115335c4bf881b51b1d66231361a0f5681ea6d78b3ee4543083f852357e20f'
            test_hash: '867eecf09707576205157be960c064e82a9750b7c4cfde67f0bdf94e0e547906'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .cm-candidate-proof
          sparse-checkout: .github/scripts
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Source identity and runtime receipt
        env:
          EXPECTED_HEAD: ${{ matrix.head }}
          SOURCE_FILE: ${{ matrix.source }}
          TEST_FILE: ${{ matrix.regression }}
          SOURCE_HASH: ${{ matrix.source_hash }}
          TEST_HASH: ${{ matrix.test_hash }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/cmem-proof"
          printf '%s  %s\n' "$SOURCE_HASH" "$SOURCE_FILE" "$TEST_HASH" "$TEST_FILE" | sha256sum -c -
          git rev-parse HEAD > "$RUNNER_TEMP/cmem-proof/head.txt"
          node --version > "$RUNNER_TEMP/cmem-proof/node.txt"
          bun --version > "$RUNNER_TEMP/cmem-proof/bun.txt"
      - name: Validate receipt evaluator rejection controls
        run: python3 .cm-candidate-proof/.github/scripts/cm-proof-evaluator.py --self-test
      - name: Install dependencies (canonical CI command)
        run: npm install --no-audit --no-fund
      - name: Verify committed plugin bundles before rebuilding
        run: bun test tests/infrastructure/version-consistency.test.ts tests/infrastructure/committed-plugin-bundles.test.ts
      - name: Exact-base negative control
        env:
          SOURCE_FILE: ${{ matrix.source }}
          TEST_FILE: ${{ matrix.regression }}
          EXPECTED_HEAD: ${{ matrix.head }}
          BEFORE_PASS: ${{ matrix.before_pass }}
          BEFORE_FAIL: ${{ matrix.before_fail }}
        run: |
          set -euo pipefail
          git checkout a2150b2c09c6da01dfdc1296f8d2c3f3975a4418 -- "$SOURCE_FILE"
          set +e
          bun test "$TEST_FILE" > "$RUNNER_TEMP/cmem-proof/before.log" 2>&1
          before_status=$?
          set -e
          git checkout "$EXPECTED_HEAD" -- "$SOURCE_FILE"
          cat "$RUNNER_TEMP/cmem-proof/before.log"
          test "$before_status" -ne 0
          python3 .cm-candidate-proof/.github/scripts/cm-proof-evaluator.py "$RUNNER_TEMP/cmem-proof/before.log" "$BEFORE_PASS" "$BEFORE_FAIL" 0 "$before_status" 1
      - name: Typecheck root and viewer (canonical CI command)
        run: npm run typecheck
      - name: Build with bundle-size guards (canonical CI command)
        run: npm run build
      - name: Preserve generated artifact diff and authored source hashes
        env:
          SOURCE_FILE: ${{ matrix.source }}
          TEST_FILE: ${{ matrix.regression }}
          SOURCE_HASH: ${{ matrix.source_hash }}
          TEST_HASH: ${{ matrix.test_hash }}
        run: |
          set -euo pipefail
          git diff --binary > "$RUNNER_TEMP/cmem-proof/generated-build.patch"
          printf '%s  %s\n' "$SOURCE_HASH" "$SOURCE_FILE" "$TEST_HASH" "$TEST_FILE" | sha256sum -c -
      - name: Positive regression with exact executed count
        env:
          TEST_FILE: ${{ matrix.regression }}
          EXPECTED_PASS: ${{ matrix.positive }}
        run: |
          set -euo pipefail
          set +e
          bun test "$TEST_FILE" 2>&1 | tee "$RUNNER_TEMP/cmem-proof/after.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${pipeline_status[1]}" -eq 0
          python3 .cm-candidate-proof/.github/scripts/cm-proof-evaluator.py "$RUNNER_TEMP/cmem-proof/after.log" "$EXPECTED_PASS" 0 0 "${pipeline_status[0]}" 0
      - name: Full repository Bun suite (canonical CI command)
        run: |
          set -euo pipefail
          set +e
          bun test tests 2>&1 | tee "$RUNNER_TEMP/cmem-proof/full-suite.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${pipeline_status[1]}" -eq 0
          python3 .cm-candidate-proof/.github/scripts/cm-proof-evaluator.py --record "$RUNNER_TEMP/cmem-proof/full-suite.log" "${pipeline_status[0]}" "${pipeline_status[1]}" > "$RUNNER_TEMP/cmem-proof/full-suite-counts.json"
      - name: Openclaw suite (canonical CI command)
        run: |
          set -euo pipefail
          set +e
          bun test openclaw 2>&1 | tee "$RUNNER_TEMP/cmem-proof/openclaw.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${pipeline_status[1]}" -eq 0
          python3 .cm-candidate-proof/.github/scripts/cm-proof-evaluator.py --record "$RUNNER_TEMP/cmem-proof/openclaw.log" "${pipeline_status[0]}" "${pipeline_status[1]}" > "$RUNNER_TEMP/cmem-proof/openclaw-counts.json"
      - name: Semantic hydration and search contract selection
        if: matrix.id == 'semantic-json'
        run: |
          set -euo pipefail
          bun test tests/worker/search/ tests/services/sqlite/summary-file-filter-columns.test.ts 2>&1 | tee "$RUNNER_TEMP/cmem-proof/search-selection.log"
      - name: Import, native prompt and sync contract selection
        if: matrix.id == 'native-import'
        run: |
          set -euo pipefail
          bun test tests/sqlite/import-row-identities.test.ts tests/sqlite/native-prompt-identity.test.ts tests/worker/sync/canonical-content.test.ts tests/worker/sync/prompt-text-clamp.test.ts 2>&1 | tee "$RUNNER_TEMP/cmem-proof/import-sync-selection.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-mem-${{ matrix.id }}-linux-proof
          path: ${{ runner.temp }}/cmem-proof/
          retention-days: 7

  windows:
    name: Windows declared core (${{ matrix.id }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: 'catalog-case'
            head: '9d8bf2a29cbb6e990ecddd302fc595377eb6b4a0'
            source: 'src/services/sqlite/SessionStore.ts'
            regression: 'tests/worker/http/routes/data-session-catalog-case.test.ts'
            positive: 2
            before_pass: 0
            before_fail: 2
            source_hash: 'ad115335c4bf881b51b1d66231361a0f5681ea6d78b3ee4543083f852357e20f'
            test_hash: '867eecf09707576205157be960c064e82a9750b7c4cfde67f0bdf94e0e547906'
    # Pinned to windows-2022 (VS2022 / v17). The windows-latest image moved to
    # windows-2025, which ships Visual Studio 18 — npm's bundled node-gyp@11.5.0
    # can't detect it ("unknown version undefined") and native tree-sitter
    # rebuilds fail during `npm install`. Revisit when node-gyp gains VS18 support.
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 2

      - name: Verify immutable source identity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '${{ matrix.head }}') { throw 'Unexpected source head' }
          if ((Get-FileHash '${{ matrix.source }}' -Algorithm SHA256).Hash.ToLower() -ne '${{ matrix.source_hash }}') { throw 'Source digest mismatch' }
          if ((Get-FileHash '${{ matrix.regression }}' -Algorithm SHA256).Hash.ToLower() -ne '${{ matrix.test_hash }}') { throw 'Regression digest mismatch' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .cm-candidate-proof
          sparse-checkout: .github/scripts
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun (worker runtime)
        run: |
          irm bun.sh/install.ps1 | iex
        shell: pwsh

      - shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }


      - shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'npm build failed' }


      # Covers the Windows-only bun resolver path that Linux CI skips, plus the
      # scripts that replaced rsync and tail: mirror pattern matching, --delete
      # protection and -a metadata reconciliation against real NTFS paths, and
      # the bounded log tail under a constrained heap.
      - shell: pwsh
        run: |
          $bun = Join-Path $env:USERPROFILE '.bun\\bin\\bun.exe'
          & $bun test tests/bun-runner.test.ts tests/scripts/mirror-dir.test.ts tests/scripts/worker-logs.test.ts 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'cmem-windows-regression.log')
          $producerStatus = $LASTEXITCODE
          if ($producerStatus -ne 0) { throw 'Windows Bun regression producer failed' }
          python .cm-candidate-proof/.github/scripts/cm-proof-evaluator.py (Join-Path $env:RUNNER_TEMP 'cmem-windows-regression.log') 51 0 2 $producerStatus 0
          if ($LASTEXITCODE -ne 0) { throw 'Windows executed counts disagree with the declared scope' }


      # The step that used to be impossible on Windows: sync-marketplace shelled
      # out to rsync. Runs the real script against a scratch USERPROFILE (Node's
      # os.homedir() reads it on Windows) so the runner's own profile is
      # untouched, then asserts the rsync semantics it replaced — stale files
      # deleted, already-installed deps and excluded trees left alone.
      - name: Exercise marketplace sync
        shell: pwsh
        run: |
          $env:PATH = "$(Join-Path $env:USERPROFILE '.bun\bin');$env:PATH"

          $scratchHome = Join-Path $env:RUNNER_TEMP 'sync-home'
          $marketplace = Join-Path $scratchHome '.claude\plugins\marketplaces\thedotmack'
          $dep = Join-Path $marketplace 'node_modules\pre-existing-dep'
          New-Item -ItemType Directory -Force -Path $dep | Out-Null
          Set-Content -Path (Join-Path $marketplace 'STALE-FROM-OLD-BUILD.js') -Value 'stale'
          Set-Content -Path (Join-Path $dep 'index.js') -Value 'installed'

          $env:USERPROFILE = $scratchHome
          node scripts/sync-marketplace.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Marketplace sync producer failed' }

          if (-not (Test-Path (Join-Path $marketplace 'plugin\.claude-plugin\plugin.json'))) {
            throw 'sync did not populate the marketplace'
          }
          if (Test-Path (Join-Path $marketplace 'STALE-FROM-OLD-BUILD.js')) {
            throw 'sync left a stale file behind (--delete equivalence broken)'
          }
          if (-not (Test-Path (Join-Path $dep 'index.js'))) {
            throw 'sync deleted installed deps that --delete protected'
          }
          if (Test-Path (Join-Path $marketplace 'workers')) {
            throw 'sync copied the excluded workers/ tree'
          }

      # worker:logs replaced `tail -n 50` + `date +%F`, neither of which exists
      # in native PowerShell. Set-Content writes CRLF, so this also covers a
      # Windows-native line ending that the bun test (LF) does not.
      - name: Exercise worker log tail
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'log-home'
          $logs = Join-Path $env:USERPROFILE '.claude-mem\logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $stamp = [DateTime]::UtcNow.ToString('yyyy-MM-dd')
          Set-Content -Path (Join-Path $logs "claude-mem-$stamp.log") -Value (1..60 | ForEach-Object { "line $_" })

          $out = node scripts/worker-logs.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Worker log producer failed' }
          if ($out.Count -ne 50) { throw "expected 50 lines, got $($out.Count)" }
          if ($out[0].TrimEnd() -ne 'line 11') { throw "expected first line 'line 11', got '$($out[0])'" }
          if ($out[49].TrimEnd() -ne 'line 60') { throw "expected last line 'line 60', got '$($out[49])'" }

      - name: Preserve generated Windows build diff
        shell: pwsh
        run: |
          $diff = git diff --binary
          if ($LASTEXITCODE -ne 0) { throw 'Generated diff capture failed' }
          $diff | Set-Content (Join-Path $env:RUNNER_TEMP 'cmem-generated.patch')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-mem-${{ matrix.id }}-windows-generated-diff
          path: |
            ${{ runner.temp }}/cmem-generated.patch
            ${{ runner.temp }}/cmem-windows-regression.log
          retention-days: 7
