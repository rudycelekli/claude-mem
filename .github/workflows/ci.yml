name: Native Windows report PDF validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-python-report:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install tzdata==2026.2
      - name: Native installed Chrome PDF controls
        run: python -m unittest discover -s plugin/skills/agent-cost-report/scripts/tests -p 'test_pdf_windows.py'
