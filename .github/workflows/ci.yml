name: Native Windows cost report validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-python-report:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native report formatter and file tests
        env:
          PYTHONUTF8: '0'
        run: python -m unittest discover -s plugin/skills/agent-cost-report/scripts/tests -p test_render.py
