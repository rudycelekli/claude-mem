name: Native Windows report ingestion validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-python-report:
    runs-on: windows-2022
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.13']
        distribution: [plugin, claude-mem-cursor, claude-mem-grok-bot, cowork, openclaw]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install tzdata==2026.2
      - name: Native report ingestion tests
        env:
          PYTHONUTF8: '0'
        run: python -m unittest discover -s ${{ matrix.distribution }}/skills/agent-cost-report/scripts/tests -p 'test_transcript_encoding.py'
      - name: Verify Codex regression detects pre-fix mojibake
        shell: pwsh
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          PYTHONUTF8: '0'
        run: |
          $source = "$env:DISTRIBUTION/skills/agent-cost-report/scripts/acr/transcripts.py"
          $tests = "$env:DISTRIBUTION/skills/agent-cost-report/scripts/tests"
          $original = [IO.File]::ReadAllBytes($source)
          try {
            $baseline = git show bfc50259f64a4e0c9e81df849095683608e87ac8:plugin/skills/agent-cost-report/scripts/acr/transcripts.py
            if ($LASTEXITCODE -ne 0) { throw "Missing pre-fix source" }
            [IO.File]::WriteAllText($source, ($baseline -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
            Push-Location $tests
            try {
              $output = python -m unittest test_transcript_encoding.TranscriptEncoding.test_codex_retains_unicode_model 2>&1 | Out-String
              $status = $LASTEXITCODE
              Write-Output $output
              if ($status -eq 0) { throw "Expected pre-fix Codex regression to fail" }
              if ($output -notmatch "AssertionError.*gpt-5-") { throw "Regression failed for an unexpected reason" }
            } finally { Pop-Location }
          } finally { [IO.File]::WriteAllBytes($source, $original) }
          exit 0
